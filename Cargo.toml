# Standalone crate (not a member of the private Hermers server workspace).
[workspace]

[package]
name = "hermers"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Official Hermers SDK — REST + gRPC clients (API key auth)"
readme = "README.md"
keywords = ["hermes", "hermers", "sdk", "rest", "grpc"]
categories = ["api-bindings", "network-programming"]
repository = "https://github.com/aduki-org/hermers-rs"
homepage = "https://github.com/aduki-org/hermers-rs"
documentation = "https://docs.rs/hermers"
exclude = [".env", ".env.*", "*.pem", "*.key"]

[features]
default = ["rest", "grpc"]
# REST / JSON (reqwest + rustls).
rest = ["dep:reqwest"]
# Native gRPC over TLS (tonic + prost). Disable if you only need REST.
grpc = ["dep:tonic", "dep:prost", "dep:tonic-prost", "dep:prost-types", "dep:tokio-stream"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "net", "time", "sync"] }
sha2 = "0.11.0"
getrandom = "0.4.3"
# REST — reqwest 0.13 renamed the feature `rustls-tls` → `rustls` (same rustls stack).
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"], optional = true }
# gRPC
tonic = { version = "0.14.6", default-features = false, features = ["transport", "tls-ring", "tls-native-roots", "codegen"], optional = true }
prost = { version = "0.14.4", optional = true }
prost-types = { version = "0.14.4", optional = true }
tonic-prost = { version = "0.14.6", optional = true }
tokio-stream = { version = "0.1.19", optional = true }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
